# Builds the Windows app on GitHub's own Windows machine whenever the desktop
# shell (or the page it bundles as its offline fallback) changes, and publishes
# it to one fixed release, "desktop-latest", under fixed file names:
#
#   https://github.com/Cuppaxx/chat/releases/download/desktop-latest/Mingus-Chatroom-Setup.exe
#   https://github.com/Cuppaxx/chat/releases/download/desktop-latest/Mingus-Chatroom-Portable.exe
#
# The chatroom's "Download now" button links to the first one, so it always
# hands out the newest build and nobody has to upload anything by hand.
name: Desktop app

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'mingus-chatroom.html'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Build installer and portable exe
        working-directory: desktop
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # What installed copies (1.1.0+) read to decide whether to update
      # themselves, and what the server's /desktop/latest reports. Written here
      # rather than trusted to electron-builder, which only emits it when a
      # publish provider is configured. The sha512 is checked before the
      # downloaded installer is ever run.
      - name: Write the update manifest
        shell: bash
        working-directory: desktop
        run: |
          V=$(node -p "require('./package.json').version")
          SHA=$(node -e "process.stdout.write(require('crypto').createHash('sha512').update(require('fs').readFileSync('dist/Mingus-Chatroom-Setup.exe')).digest('base64'))")
          SIZE=$(node -p "require('fs').statSync('dist/Mingus-Chatroom-Setup.exe').size")
          printf 'version: %s\npath: Mingus-Chatroom-Setup.exe\nsha512: %s\nsize: %s\n' "$V" "$SHA" "$SIZE" > dist/latest.yml
          cat dist/latest.yml

      - name: Move the desktop-latest tag to this commit
        shell: bash
        run: |
          git tag -f desktop-latest
          git push -f origin desktop-latest

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Mingus Chatroom for Windows (latest)
          body: |
            The newest build of the Mingus Chatroom desktop app, rebuilt automatically from `main`.

            - **Mingus-Chatroom-Setup.exe** — installer, with Start menu and desktop shortcuts
            - **Mingus-Chatroom-Portable.exe** — runs from anywhere, installs nothing

            Windows SmartScreen will warn because the app is unsigned: **More info → Run anyway**.
          files: |
            desktop/dist/Mingus-Chatroom-Setup.exe
            desktop/dist/Mingus-Chatroom-Portable.exe
            desktop/dist/latest.yml
          make_latest: true
          fail_on_unmatched_files: true
